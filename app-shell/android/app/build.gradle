plugins { id 'com.android.application' }

android {
    namespace 'com.crrg.terminal'
    compileSdk 34
    defaultConfig {
        applicationId "com.crrg.terminal"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            // 正式发布请在本地配好签名（见 README）
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
